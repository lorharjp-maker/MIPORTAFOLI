    <hr>

    <main>
        <h1>Contacta amb mi</h1>

        <form action="#" method="post">

            <div>
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" name="nom"
                       placeholder="Escriu el teu nom..." required>
            </div>

            <br>

            <div>
                <label for="correu">Correu electrònic</label>
                <input type="email" id="correu" name="correu"
                       placeholder="nom@exemple.com" required>
            </div>

            <br>

            <div>
                <label for="assumpte">Assumpte</label>
                <input type="text" id="assumpte" name="assumpte"
                       placeholder="Motiu del missatge..." required>
            </div>

            <br>

            <div>
                <label for="missatge">Missatge</label><br>
                <textarea id="missatge" name="missatge" rows="4" cols="30"
                          placeholder="Escriu el teu missatge aquí..." required></textarea>
            </div>

            <br>

            <button type="submit">Enviar missatge</button>

        </form>
    </main>
